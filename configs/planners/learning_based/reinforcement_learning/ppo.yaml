name: ppo
type: learning_based

planner:
  algorithm: ppo

  policy:
    type: mlp
    hidden_layers: [256, 256]
    activation: tanh

  observation:
    type: local_map_goal
    channels: 4

  action:
    type: velocity
    dimensions: 2

  training:
    total_steps: 1000000
    rollout_length: 2048
    minibatch_size: 64
    epochs: 10

  optimizer:
    learning_rate: 3.0e-4

  ppo:
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    entropy_coefficient: 0.01
    value_coefficient: 0.5

environment:
  map_type: dynamic_cost_map

robot:
  model: differential_drive

constraints:
  collision_check: true

runtime:
  max_time: 5.0

random:
  seed: 42

output:
  save_policy: true
  return_trajectory: true
  return_statistics: true

