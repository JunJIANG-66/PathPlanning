name: bfs
type: graph_based

planner:
  algorithm: bfs
  connectivity: 4
  goal_test: exact

environment:
  map_type: occupancy_grid

cost:
  edge_cost: unit

constraints:
  allow_unknown: false

runtime:
  max_time: 5.0
  max_iterations: 100000

random:
  seed: 42

output:
  return_path: true
  return_cost: true
  return_statistics: true
  return_search_tree: false

