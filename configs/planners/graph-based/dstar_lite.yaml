name: dstar_lite

type: graph_based

planner:
  algorithm: dstar_lite

  heuristic: manhattan

  allow_diagonal: true

  diagonal_cost: 1.41421356

environment:
  map_type: dynamic_cost_map

  replanning: true

  update_frequency: 10.0

objective:
  path_length_weight: 1.0
  obstacle_cost_weight: 1.0

runtime:
  max_time: 5.0
  max_replans: 100
