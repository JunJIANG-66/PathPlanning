name: rrt_mpc
type: hybrid

planner:
  algorithm: rrt_mpc

  global_planner:
    type: rrt_star
    step_size: 0.5
    goal_bias: 0.05
    max_iterations: 10000

  local_planner:
    type: mpc

    horizon:
      steps: 20
      dt: 0.1

    objective:
      state_weight: 1.0
      control_weight: 0.1
      terminal_weight: 1.0
      obstacle_weight: 1.0

    obstacle:
      safety_margin: 0.2

  coordination:
    waypoint_tolerance: 0.5
    replan_global: true
    replan_frequency: 2.0

environment:
  map_type: dynamic_cost_map

robot:
  model: differential_drive
  radius: 0.25

constraints:
  collision_check: true

runtime:
  max_time: 30.0

random:
  seed: 42

output:
  return_path: true
  return_trajectory: true
  return_statistics: true

