name: astar_mpc
type: hybrid

planner:
  algorithm: astar_mpc

  global_planner:
    type: astar
    heuristic: octile
    connectivity: 8

  local_planner:
    type: mpc

    horizon:
      steps: 20
      dt: 0.1

    objective:
      state_weight: 1.0
      control_weight: 0.1
      terminal_weight: 1.0
      obstacle_weight: 1.0

    obstacle:
      safety_margin: 0.2

  coordination:
    waypoint_tolerance: 0.5
    replan_global: true
    replan_frequency: 2.0

environment:
  map_type: dynamic_cost_map

robot:
  model: differential_drive
  radius: 0.25

constraints:
  collision_check: true
  max_velocity: 1.0
  max_acceleration: 0.5

runtime:
  max_time: 10.0

random:
  seed: 42

output:
  return_path: true
  return_trajectory: true
  return_controls: true
  return_statistics: true

