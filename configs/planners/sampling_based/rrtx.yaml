name: rrtx
type: sampling_based

planner:
  algorithm: rrtx

  step_size: 0.5
  goal_bias: 0.05

  neighborhood:
    type: radius
    radius: adaptive
    gamma: 2.0

  dynamic_replanning: true
  repair_tree: true

  local_planner:
    type: straight_line
    resolution: 0.05

environment:
  map_type: dynamic_cost_map
  update_frequency: 10.0

cost:
  edge_cost: map_cost

robot:
  model: point
  radius: 0.25

constraints:
  collision_check: true

runtime:
  max_time: 20.0
  max_iterations: 100000
  max_replans: 100

random:
  seed: 42

output:
  return_path: true
  return_cost: true
  return_statistics: true
  return_tree: true

