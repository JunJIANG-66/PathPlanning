name: prm
type: sampling_based

planner:
  algorithm: prm

  space: configuration
  sampler: uniform

  num_samples: 1000
  connection_radius: 2.0
  max_neighbors: 15

  local_planner:
    type: straight_line
    resolution: 0.05

  query:
    shortest_path: true

environment:
  map_type: occupancy_grid

robot:
  model: point
  radius: 0.25

constraints:
  collision_check: true

runtime:
  max_time: 10.0
  max_iterations: 100000

random:
  seed: 42

output:
  return_path: true
  return_cost: true
  return_statistics: true
  return_roadmap: true

