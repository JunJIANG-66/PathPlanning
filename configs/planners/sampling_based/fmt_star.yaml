name: fmt_star
type: sampling_based

planner:
  algorithm: fmt_star

  num_samples: 2000
  neighborhood:
    type: radius
    radius: adaptive
    gamma: 2.0

  lazy_collision_check: true

  local_planner:
    type: straight_line
    resolution: 0.05

cost:
  edge_cost: distance

environment:
  map_type: occupancy_grid

robot:
  model: point
  radius: 0.25

constraints:
  collision_check: true

runtime:
  max_time: 20.0

random:
  seed: 42

output:
  return_path: true
  return_cost: true
  return_statistics: true

