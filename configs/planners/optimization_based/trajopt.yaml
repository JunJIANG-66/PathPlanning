name: trajopt
type: optimization_based

planner:
  algorithm: trajopt

  num_waypoints: 100
  iterations: 100

  optimizer:
    type: sequential_convex
    tolerance: 1.0e-4

  objective:
    smoothness_weight: 1.0
    obstacle_weight: 1.0
    velocity_weight: 0.1
    acceleration_weight: 0.1

  obstacle:
    safety_margin: 0.2

environment:
  map_type: cost_map

robot:
  model: point
  radius: 0.25

constraints:
  collision_check: true
  max_velocity: 1.0
  max_acceleration: 1.0

runtime:
  max_time: 30.0

random:
  seed: 42

output:
  return_path: true
  return_cost: true
  return_statistics: true

