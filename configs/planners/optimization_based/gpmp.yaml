name: gpmp
type: optimization_based

planner:
  algorithm: gpmp

  num_waypoints: 100
  iterations: 100

  gaussian_process:
    kernel: squared_exponential
    length_scale: 1.0
    sigma: 1.0

  objective:
    smoothness_weight: 1.0
    obstacle_weight: 1.0
    prior_weight: 1.0

  obstacle:
    cost_function: signed_distance
    safety_margin: 0.2

environment:
  map_type: cost_map

robot:
  model: point
  radius: 0.25

constraints:
  collision_check: true

runtime:
  max_time: 30.0

random:
  seed: 42

output:
  return_path: true
  return_cost: true
  return_statistics: true

