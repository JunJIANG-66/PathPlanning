name: kinodynamic_rrt
type: trajectory_based

planner:
  algorithm: kinodynamic_rrt

  state_space:
    dimensions: [x, y, theta, v, omega]

  control_space:
    dimensions: [acceleration, angular_acceleration]

  step_duration: 0.2
  goal_bias: 0.05
  max_iterations: 20000

  propagation:
    integration_method: rk4
    resolution: 0.05

cost:
  edge_cost: time

environment:
  map_type: dynamic_cost_map

robot:
  model: differential_drive

constraints:
  max_velocity: 1.0
  max_acceleration: 0.5
  max_angular_velocity: 1.0

runtime:
  max_time: 30.0

random:
  seed: 42

output:
  return_trajectory: true
  return_cost: true
  return_statistics: true
  return_tree: true

