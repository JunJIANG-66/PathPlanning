[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "path-planning"
version = "0.1.0"

description = "A unified and extensible research framework for robotic path planning."

readme = "README.md"

requires-python = ">=3.10"

license = { file = "LICENSE" }

authors = [
    { name = "Jun JIANG" }
]

keywords = [
    "robotics",
    "path planning",
    "motion planning",
    "autonomous navigation",
    "robot navigation",
    "benchmarking",
    "reinforcement learning"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "pyyaml>=6.0"
]


[project.optional-dependencies]

dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.6"
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5"
]

learning = [
    "torch>=2.0",
    "scikit-learn>=1.3"
]

visualization = [
    "plotly>=5.18"
]

all = [
    "path-planning[dev,docs,learning,visualization]"
]


[project.urls]
Homepage = "https://github.com/JunJIANG-66/PathPlanning/tree/main"
Repository = "https://github.com/JunJIANG-66/PathPlanning/tree/main"
Documentation = "https://github.com/JunJIANG-66/PathPlanning/tree/main"
# Issues = "https://github.com/YOUR_USERNAME/path-planning/issues"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = [
    "test_*.py",
    "*_test.py"
]

addopts = "-ra"


[tool.ruff]
line-length = 88
target-version = "py310"

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__"
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
